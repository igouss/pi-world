\* Fixed, properties 1-5 (safety): two calls, one awaiting a peer; two VM slots, one warm VM; one crash.
CONSTANTS
    Version = "fixed"
    Bug = "none"
    NCalls = 2
    NChangers = 2
    AwaitPeer = {1}
    Max = 2
    Warm = 1
    MaxCrashes = 1
    CommitMayFail = TRUE
    Scheduling = "await"
    Reruns = 1
    Readers = {}
SPECIFICATION Spec
INVARIANTS
    WritesAllOrNone
    FailedWritesNothing
    RowsFromOneCommit
    HeadBlobPresent
    AcceptedKept
    OneCommitPerRevision
    CallsOnCommittedHeaps
    CurrentIsCommitted
    SlotsBounded
    HandedAtAskedRevision
    WorkbenchAtHead
    ConflictWritesNothing
    RefusedNeverGranted
    NoLostUpdate
    Serializable
PROPERTIES
    HistoryKept
