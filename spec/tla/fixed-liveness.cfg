\* Fixed, property 4 liveness: a waiting call is granted or refused, and every call in the pool finishes; three calls on one slot.
CONSTANTS
    Version = "fixed"
    Bug = "none"
    NCalls = 3
    NChangers = 1
    AwaitPeer = {1}
    Max = 1
    Warm = 1
    MaxCrashes = 0
    CommitMayFail = TRUE
    Scheduling = "await"
    Reruns = 1
    Readers = {}
SPECIFICATION FairSpec
PROPERTIES
    WaitingResolved
    WaitingCallFinishes
