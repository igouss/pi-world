\* Deployed, properties 1-4 (safety), with one VM slot, so the second call waits for it.
CONSTANTS
    Version = "deployed"
    Bug = "none"
    NCalls = 2
    NChangers = 2
    AwaitPeer = {1}
    Max = 1
    Warm = 1
    MaxCrashes = 1
    CommitMayFail = TRUE
    Scheduling = "await"
    Reruns = 0
    Readers = {}
SPECIFICATION Spec
INVARIANTS
    WritesAllOrNone
    FailedWritesNothing
    RowsFromOneCommit
    HeadBlobPresent
    AcceptedKept
    OneCommitPerRevision
    CallsOnCommittedHeaps
    CurrentIsCommitted
    SlotsBounded
    HandedAtAskedRevision
    MainAtHead
PROPERTIES
    HistoryKept
